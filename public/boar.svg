<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 288">
  <!-- body: white coat -->
  <path d="M40 288 C40 220 70 196 108 196 C146 196 176 220 176 288 Z" fill="#ffffff" stroke="#d9dee8" stroke-width="3"/>
  <!-- coat lapels -->
  <path d="M108 200 L84 206 L96 252 L108 226 Z" fill="#eef1f7"/>
  <path d="M108 200 L132 206 L120 252 L108 226 Z" fill="#eef1f7"/>
  <!-- shirt -->
  <path d="M96 202 L108 226 L120 202 Z" fill="#7aa2ff"/>
  <!-- stethoscope -->
  <path d="M86 206 C70 230 68 254 82 262" fill="none" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="266" r="8" fill="#9aa5b8" stroke="#2d3748" stroke-width="4"/>
  <!-- pocket with pens -->
  <rect x="128" y="238" width="26" height="22" rx="4" fill="#eef1f7" stroke="#d9dee8" stroke-width="2"/>
  <rect x="134" y="228" width="5" height="16" rx="2" fill="#4c7dff"/>
  <rect x="143" y="231" width="5" height="13" rx="2" fill="#ff5a5f"/>

  <!-- ears -->
  <path d="M46 70 C38 40 52 22 70 30 C82 36 86 56 84 72 Z" fill="#7a4a2c"/>
  <path d="M54 64 C50 46 58 36 68 40 C76 44 78 56 76 66 Z" fill="#e8a08a"/>
  <path d="M170 70 C178 40 164 22 146 30 C134 36 130 56 132 72 Z" fill="#7a4a2c"/>
  <path d="M162 64 C166 46 158 36 148 40 C140 44 138 56 140 66 Z" fill="#e8a08a"/>
  <!-- bristly crest -->
  <path d="M88 44 L94 26 L100 42 L106 22 L112 42 L118 26 L124 44 Z" fill="#5c361f"/>

  <!-- head -->
  <ellipse cx="108" cy="122" rx="76" ry="80" fill="#9a6340"/>
  <!-- lighter face -->
  <ellipse cx="108" cy="140" rx="58" ry="56" fill="#b47a52"/>

  <!-- cheeks -->
  <ellipse cx="62" cy="146" rx="13" ry="9" fill="#f29b9b" opacity="0.75"/>
  <ellipse cx="154" cy="146" rx="13" ry="9" fill="#f29b9b" opacity="0.75"/>

  <!-- eyes -->
  <ellipse cx="80" cy="108" rx="15" ry="17" fill="#ffffff"/>
  <ellipse cx="136" cy="108" rx="15" ry="17" fill="#ffffff"/>
  <circle cx="83" cy="111" r="9.5" fill="#2b1a10"/>
  <circle cx="133" cy="111" r="9.5" fill="#2b1a10"/>
  <circle cx="86" cy="107" r="3.4" fill="#ffffff"/>
  <circle cx="136" cy="107" r="3.4" fill="#ffffff"/>
  <!-- brows -->
  <path d="M66 86 Q80 78 94 86" fill="none" stroke="#5c361f" stroke-width="5" stroke-linecap="round"/>
  <path d="M122 86 Q136 78 150 86" fill="none" stroke="#5c361f" stroke-width="5" stroke-linecap="round"/>

  <!-- snout -->
  <ellipse cx="108" cy="156" rx="34" ry="25" fill="#f0a7a0"/>
  <ellipse cx="108" cy="153" rx="34" ry="22" fill="#f6b8b1"/>
  <ellipse cx="96" cy="154" rx="6" ry="9" fill="#9b4d4a"/>
  <ellipse cx="120" cy="154" rx="6" ry="9" fill="#9b4d4a"/>

  <!-- smile -->
  <path d="M90 184 Q108 196 126 184" fill="none" stroke="#5c361f" stroke-width="4.5" stroke-linecap="round"/>
  <!-- tusks -->
  <path d="M84 178 C78 172 76 160 80 152 C84 162 88 170 92 176 Z" fill="#fff8e7" stroke="#e2d6b8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M132 178 C138 172 140 160 136 152 C132 162 128 170 124 176 Z" fill="#fff8e7" stroke="#e2d6b8" stroke-width="2" stroke-linejoin="round"/>
</svg>
