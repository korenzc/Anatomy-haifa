<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3effd"/><stop offset="1" stop-color="#e9e2fb"/></linearGradient>
<linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7a2f7"/><stop offset="1" stop-color="#9273ea"/></linearGradient>
<clipPath id="circ"><circle cx="246" cy="268" r="196"/></clipPath>
<clipPath id="headc"><ellipse cx="236" cy="236" rx="126" ry="116"/></clipPath>
<clipPath id="torsoc"><path d="M 132 520 C 132 424, 180 372, 242 370 C 306 370, 350 420, 354 520 Z"/></clipPath>
<filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4a2fa0" flood-opacity=".18"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<g transform="translate(256 256) scale(0.94) translate(-256 -256)">
<circle cx="246" cy="268" r="196" fill="url(#disc)" filter="url(#soft)"/>
<g clip-path="url(#circ)">
  <!-- torso -->
  <path d="M 132 520 C 132 424, 180 372, 242 370 C 306 370, 350 420, 354 520 Z" fill="#fffaf4" stroke="#2b1d5e" stroke-width="13" stroke-linejoin="round"/>
  <g clip-path="url(#torsoc)">
    <rect x="168" y="394" width="152" height="140" rx="36" fill="#9c80ee"/>
    <g fill="none" stroke="#fffaf4" stroke-width="15" stroke-linecap="round">
      <path d="M 244 404 L 244 520"/>
      <path d="M 232 424 Q 205 418 190 436"/><path d="M 256 424 Q 283 418 298 436"/>
      <path d="M 232 452 Q 203 446 186 466"/><path d="M 256 452 Q 285 446 302 466"/>
      <path d="M 232 480 Q 203 474 186 494"/><path d="M 256 480 Q 285 474 302 494"/>
    </g>
  </g>
  <!-- waving arm -->
  <path d="M 318 412 C 346 384, 370 340, 382 296" fill="none" stroke="#2b1d5e" stroke-width="50" stroke-linecap="round"/>
  <path d="M 318 412 C 346 384, 370 340, 382 296" fill="none" stroke="#fffaf4" stroke-width="26" stroke-linecap="round"/>
</g>
<!-- head -->
<ellipse cx="236" cy="236" rx="126" ry="116" fill="#ece4fa"/>
<g clip-path="url(#headc)"><ellipse cx="256" cy="226" rx="122" ry="114" fill="#fffaf4"/></g>
<ellipse cx="236" cy="236" rx="126" ry="116" fill="none" stroke="#2b1d5e" stroke-width="13"/>
<!-- cheeks -->
<ellipse cx="184" cy="290" rx="20" ry="11" fill="#f4a3c4" opacity=".45"/>
<ellipse cx="306" cy="280" rx="20" ry="11" fill="#f4a3c4" opacity=".45"/>
<!-- happy closed eyes -->
<g fill="none" stroke="#2b1d5e" stroke-width="14" stroke-linecap="round">
  <path d="M 168 270 Q 190 238 212 268"/>
  <path d="M 268 260 Q 290 228 312 258"/>
</g>
<!-- little smile -->
<path d="M 232 296 Q 242 306 252 296" fill="none" stroke="#2b1d5e" stroke-width="9" stroke-linecap="round"/>
<!-- open waving hand -->
<g transform="translate(390 256) rotate(14) scale(1.15)">
  <ellipse cx="-30" cy="6" rx="15" ry="10" transform="rotate(-35 -30 6)" fill="#fffaf4" stroke="#2b1d5e" stroke-width="11"/>
  <rect x="-28" y="-40" width="56" height="70" rx="26" fill="#fffaf4" stroke="#2b1d5e" stroke-width="12"/>
  <g stroke="#2b1d5e" stroke-width="7" stroke-linecap="round" opacity=".8"><path d="M -9 -38 L -9 -22"/><path d="M 9 -38 L 9 -22"/></g>
</g>
<!-- wave lines -->
<g fill="none" stroke="#2b1d5e" stroke-width="11" stroke-linecap="round">
  <path d="M 414 168 L 408 196"/><path d="M 448 186 L 428 208"/><path d="M 466 228 L 440 234"/>
</g>
</g></svg>